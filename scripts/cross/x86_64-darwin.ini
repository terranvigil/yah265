# x86-64 on an Apple Silicon Mac: clang targets x86_64 and Rosetta 2 runs
# the result, so meson runs the tests without a wrapper. Rosetta executes
# AVX2, FMA and BMI2 but hides them from CPUID unless the process
# environment has ROSETTA_ADVERTISE_AVX=1 (docs/x86-plan.md).
[binaries]
c = ['clang', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = false
