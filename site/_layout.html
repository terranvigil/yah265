<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="yah265">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{og_url}}">
<meta name="twitter:card" content="{{twitter_card}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
{{social}}<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cg%20fill='%23454b5a'%20stroke='%23ff4d1a'%20stroke-width='5'%3E%3Crect%20x='6'%20y='6'%20width='22'%20height='22'%20rx='6'/%3E%3Crect%20x='36'%20y='6'%20width='22'%20height='22'%20rx='6'/%3E%3Crect%20x='6'%20y='36'%20width='22'%20height='22'%20rx='6'/%3E%3Crect%20x='36'%20y='36'%20width='22'%20height='22'%20rx='6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/site.css">
<!-- a fragment url() in the linked stylesheet could resolve against the
     stylesheet's own address, so the marker rules stay in the page -->
<style>
.d-arrow { marker-end: url(#d-arrowhead); }
.d-arrow.d-accent { marker-end: url(#d-arrowhead-accent); }
.d-arrow.d-muted { marker-end: url(#d-arrowhead-muted); }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the page</a>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <marker id="d-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head" d="M0 0.8L10 5L0 9.2z"/></marker>
    <marker id="d-arrowhead-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-accent" d="M0 0.8L10 5L0 9.2z"/></marker>
    <marker id="d-arrowhead-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-head d-muted" d="M0 0.8L10 5L0 9.2z"/></marker>
  </defs>
</svg>
<header class="site">
  <div class="bar">
    <a class="brand" href="index.html"><picture><source srcset="assets/yah265-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="assets/yah265-logo-light.png" alt="yah265" width="909" height="220"></picture></a>
    <nav class="top" aria-label="Site">
      {{nav}}
    </nav>
    <div class="search" role="search" hidden>
      <label class="vh" for="q">Search the docs</label>
      <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-controls="q-results">
      <kbd aria-hidden="true">/</kbd>
      <div id="q-results" class="results" hidden></div>
    </div>
    <details class="mnav">
      <summary>Menu</summary>
      <nav class="sheet" aria-label="All pages">{{mobile_nav}}</nav>
    </details>
  </div>
</header>
<div class="wrap">
<aside class="toc" aria-label="Pages and sections">{{toc}}</aside>
<main id="content">
{{onpage}}
<article>
{{content}}
</article>
{{pager}}
</main>
</div>
<footer class="site">
  <div class="wrap">
    <p>yah265 is licensed GPL-2.0-or-later. A commercial license is also available: write to
    <a href="mailto:terranvigil@gmail.com">terranvigil@gmail.com</a>. The source is on
    <a href="https://github.com/terranvigil/yah265">GitHub</a>. {{built_from}}</p>
  </div>
</footer>
<script src="assets/site.js" defer></script>
</body>
</html>
