</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>For the same file size, yah265's CRF is</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>about 2 below x265's</text>
<text x='20' y='73' font-size='12.5' class='t2'>Each faint line is one film at one size. Both encoders at medium.</text>
