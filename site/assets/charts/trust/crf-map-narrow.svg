<svg xmlns='http://www.w3.org/2000/svg' width='480' height='509' viewBox='0 0 480 509' role='img'>
<title>For the same file size, yah265's CRF is about 2 below x265's</title><desc>The yah265 CRF that writes the same file size as each x265 CRF, one faint line per film cell and the median over the cells.</desc>
