<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 684' role='img'>
<title>yah265 is faster than x265 at each picture size on all three machines</title><desc>Bars of the median times faster than x265 at the same file size, per picture size, on an Apple M5 Max, an Intel Xeon and an AWS Graviton4. Both encoders at preset medium with SIMD on all cores.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>yah265 is faster than x265 at each picture</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>size on all three machines</text>
<text x='20' y='73' font-size='12.5' class='t2'>Median times faster at the same file size. Both encoders at preset</text>
<text x='20' y='90' font-size='12.5' class='t2'>medium, SIMD on all cores. Right is faster.</text>
