<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 368' role='img'>
<title>When yah265 finishes, x265 is 56% of the way through</title><desc>Two bars racing over the same encode. The yah265 bar reaches the end. The x265 bar has covered 56% of the distance at that moment, which is the median over 30 size-matched cells.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>When yah265 finishes, x265 is 56% of the</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>way through</text>
<text x='20' y='73' font-size='12.5' class='t2'>The median of 30 CRF encodes at the same file size on an Apple M5</text>
<text x='20' y='90' font-size='12.5' class='t2'>Max. Both at preset medium with SIMD on all cores.</text>
<g transform='translate(0 26)'>
<style>
.run{transform-box:fill-box;transform-origin:left center;animation:run 2.4s linear both}
.after{animation:show .4s 2.4s both}
@keyframes run{from{transform:scaleX(0)}}
@keyframes show{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.run,.after{animation:none}}
</style>
<line x1='20.0' y1='148' x2='20.0' y2='260' class='grid'/>
<text x='20.0' y='278.0' font-size='12' class='t2' text-anchor='start'>start</text>
<line x1='130.0' y1='148' x2='130.0' y2='260' class='grid'/>
<line x1='240.0' y1='148' x2='240.0' y2='260' class='grid'/>
<text x='240.0' y='278.0' font-size='12' class='t2' text-anchor='middle'>50%</text>
<line x1='350.0' y1='148' x2='350.0' y2='260' class='grid'/>
<line x1='460.0' y1='148' x2='460.0' y2='260' class='base' stroke-width='2' stroke-dasharray='4 4'/>
<text x='460.0' y='278.0' font-size='12' class='t2' text-anchor='end'>finish</text>
<rect x='20.0' y='158' width='440.0' height='28' rx='4' class='band'/>
<path d='M20.0,158.0 H456.0 Q460.0,158.0 460.0,162.0 V182.0 Q460.0,186.0 456.0,186.0 H20.0 Z' class='run s1'/>
<text x='20.0' y='150.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>yah265</text>
<rect x='20.0' y='222' width='440.0' height='28' rx='4' class='band'/>
<path d='M20.0,222.0 H262.4 Q266.4,222.0 266.4,226.0 V246.0 Q266.4,250.0 262.4,250.0 H20.0 Z' class='run sx'/>
<text x='20.0' y='214.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>x265</text>
<g class='after'>
<text x='20.0' y='122.0' font-size='34' class='note' text-anchor='start' font-weight='700'>1.8x</text>
<text x='124.0' y='122.0' font-size='15' class='t2' text-anchor='start'>faster than x265</text>
<text x='276.4' y='241.0' font-size='13' class='t1' text-anchor='start'>56% done</text>
</g>
<line x1='20' y1='290' x2='460' y2='290' class='grid'/>
<circle cx='26.0' cy='308.0' r='5' class='s1 ring' stroke-width='2'/>
<text x='38.0' y='312.0' font-size='12.5' class='t1' text-anchor='start'>At that file size yah265 also scores a median 1.23 VMAF v1</text>
<text x='38.0' y='328.9' font-size='12.5' class='t1' text-anchor='start'>points higher than x265.</text>
</g>
</svg>
