<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 626' role='img'>
<title>yah265 is faster than x265 at every picture size on all three machines</title><desc>Bars of the median times faster than x265 at the same file size, per picture size, on an Apple M5 Max, an Intel Xeon and an AWS Graviton4. Both encoders at preset medium with SIMD on all cores.</desc>
