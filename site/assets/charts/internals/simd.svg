<svg xmlns='http://www.w3.org/2000/svg' width='900' height='380' viewBox='0 0 900 380' role='img'>
<title>SIMD speeds x265 up more than it speeds yah265 up</title><desc>All-core wall time in plain C over all-core wall time with SIMD, median over each picture size's short clips, for yah265 and x265 on three machines.</desc>
