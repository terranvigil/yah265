<svg xmlns='http://www.w3.org/2000/svg' width='900' height='516' viewBox='0 0 900 516' role='img'>
<title>yah265 is faster than x265 at all three goals on all three machines</title><desc>Median times faster than x265 medium at the same file size, per class and tier, for one thread in C, all cores in C and all cores with SIMD, on an Apple M5 Max, an x86-64 Xeon and a Graviton4.</desc>
