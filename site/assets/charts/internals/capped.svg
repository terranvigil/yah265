<svg xmlns='http://www.w3.org/2000/svg' width='900' height='354' viewBox='0 0 900 354' role='img'>
<title>yah265 stays ahead when both encoders are held to one instruction set</title><desc>Median times faster than x265 on the short clips with both encoders capped at SSE4.2, both at AVX2, and yah265 at AVX-512 against x265 at AVX2, per class on one Xeon.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='24.0' y='40.0' font-size='22' class='t1' text-anchor='start' font-weight='600'>Ahead of x265 with both encoders held to one instruction set</text>
<text x='24.0' y='64.0' font-size='14' class='t2' text-anchor='start'>Median times faster than x265 medium on the short clips, SIMD on 16 vCPUs of one Xeon 8488C.</text>
<circle cx='30.0' cy='86.0' r='5.5' class='s1 ring' stroke-width='2'/>
<text x='42.0' y='91.0' font-size='13' class='t2' text-anchor='start'>both at SSE4.2</text>
<rect x='165.1' y='81.0' width='9.9' height='9.9' rx='1.5' class='s2 ring' stroke-width='2'/>
<text x='182.0' y='91.0' font-size='13' class='t2' text-anchor='start'>both at AVX2</text>
<line x1='193.3' y1='108' x2='193.3' y2='292' class='base' stroke-dasharray='4 3'/>
<text x='193.3' y='312.0' font-size='12' class='t2' text-anchor='middle'>1x (x265)</text>
<line x1='360.0' y1='108' x2='360.0' y2='292' class='grid'/>
<text x='360.0' y='312.0' font-size='12' class='t2' text-anchor='middle'>1.5x</text>
<line x1='526.7' y1='108' x2='526.7' y2='292' class='grid'/>
<text x='526.7' y='312.0' font-size='12' class='t2' text-anchor='middle'>2x</text>
<line x1='693.3' y1='108' x2='693.3' y2='292' class='grid'/>
<text x='693.3' y='312.0' font-size='12' class='t2' text-anchor='middle'>2.5x</text>
<line x1='860.0' y1='108' x2='860.0' y2='292' class='grid'/>
<text x='860.0' y='312.0' font-size='12' class='t2' text-anchor='middle'>3x</text>
<text x='485.0' y='340.0' font-size='13' class='t2' text-anchor='middle'>times faster than x265 (right is faster)</text>
<text x='98.0' y='142.0' font-size='13' class='t1' text-anchor='end'>CIF</text>
<line x1='310.5' y1='138.0' x2='380.8' y2='138.0' class='span' stroke-width='2'/>
<circle cx='380.8' cy='138.0' r='6' class='s1 ring' stroke-width='2'/>
<rect x='305.1' y='132.6' width='10.8' height='10.8' rx='1.5' class='s2 ring' stroke-width='2'/>
<text x='98.0' y='186.0' font-size='13' class='t1' text-anchor='end'>720p</text>
<line x1='380.8' y1='182.0' x2='526.7' y2='182.0' class='span' stroke-width='2'/>
<circle cx='526.7' cy='182.0' r='6' class='s1 ring' stroke-width='2'/>
<rect x='375.4' y='176.6' width='10.8' height='10.8' rx='1.5' class='s2 ring' stroke-width='2'/>
<text x='98.0' y='230.0' font-size='13' class='t1' text-anchor='end'>1080p</text>
<line x1='252.2' y1='226.0' x2='343.1' y2='226.0' class='span' stroke-width='2'/>
<circle cx='343.1' cy='226.0' r='6' class='s1 ring' stroke-width='2'/>
<rect x='246.8' y='220.6' width='10.8' height='10.8' rx='1.5' class='s2 ring' stroke-width='2'/>
<text x='98.0' y='274.0' font-size='13' class='t1' text-anchor='end'>4K</text>
<line x1='526.7' y1='270.0' x2='600.7' y2='270.0' class='span' stroke-width='2'/>
<circle cx='600.7' cy='270.0' r='6' class='s1 ring' stroke-width='2'/>
<rect x='521.3' y='264.6' width='10.8' height='10.8' rx='1.5' class='s2 ring' stroke-width='2'/>
</svg>
