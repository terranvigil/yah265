<text x='314.5' y='252.0' font-size='12' class='t1' text-anchor='start'>10.6x</text>
<text x='295.9' y='267.0' font-size='12' class='t2' text-anchor='start'>9.7x</text>
<text x='72.0' y='305.0' font-size='13' class='t1' text-anchor='end'>4K</text>
<path d='M82.0,287.0 H203.0 Q207.0,287.0 207.0,291.0 V296.0 Q207.0,300.0 203.0,300.0 H82.0 Z' class='s1'/>
<path d='M82.0,302.0 H257.8 Q261.8,302.0 261.8,306.0 V311.0 Q261.8,315.0 257.8,315.0 H82.0 Z' class='sx'/>
<text x='213.0' y='298.0' font-size='12' class='t1' text-anchor='start'>5.8x</text>
<text x='267.8' y='313.0' font-size='12' class='t2' text-anchor='start'>8.4x</text>
<text x='240.0' y='366.0' font-size='13' class='t2' text-anchor='middle'>times faster on all cores than on one thread</text>
