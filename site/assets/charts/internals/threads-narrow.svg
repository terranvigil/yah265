<text x='72.0' y='259.0' font-size='13' class='t1' text-anchor='end'>1080p</text>
<path d='M82.0,241.0 H304.5 Q308.5,241.0 308.5,245.0 V250.0 Q308.5,254.0 304.5,254.0 H82.0 Z' class='s1'/>
