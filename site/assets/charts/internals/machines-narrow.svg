<text x='20' y='30' font-size='18' class='t1' font-weight='600'>Faster than x265 at all three goals, on</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>all three machines</text>
<text x='20' y='73' font-size='12.5' class='t2'>Median times faster than x265 medium at the same file size, per</text>
<text x='20' y='90' font-size='12.5' class='t2'>class and clip length.</text>
