<svg xmlns='http://www.w3.org/2000/svg' width='900' height='482' viewBox='0 0 900 482' role='img'>
<title>Against x265 as shipped, every group is at least 1.25x faster</title><desc>Dot plot in three panels, one per goal, of the median times faster than x265 medium for each class and tier on an Apple M5 Max, a Xeon 8488C and a Graviton4.</desc>
