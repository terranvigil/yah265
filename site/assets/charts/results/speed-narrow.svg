<text x='20' y='73' font-size='12.5' class='t2'>Dot: a row's median. Tick: its slowest clip. The limit is 1x for</text>
<text x='20' y='90' font-size='12.5' class='t2'>the median and the dashed 0.87x for the slowest clip.</text>
