<svg xmlns='http://www.w3.org/2000/svg' width='480' height='726' viewBox='0 0 480 726' role='img'>
<title>A lookahead of 12 costs up to 3.4 BD-rate points against 20</title><desc>Two line charts, CRF and VBR, of the change in BD-rate at lookahead depths 12, 20 and 30 for four cells, with the median drawn heavier.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>A lookahead of 12 costs up to 3.4 BD-rate</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>points against 20</text>
<text x='20' y='73' font-size='12.5' class='t2'>BD-rate on VMAF v1 at each depth, less the same cell's at 20. x265</text>
<text x='20' y='90' font-size='12.5' class='t2'>stays at its own 20. Below zero is better than 20.</text>
<g transform='translate(0 26)'>
<line x1='24' y1='86' x2='44' y2='86' class='l1' stroke-width='3'/>
<text x='50.0' y='91.0' font-size='13' class='t2' text-anchor='start'>median of the four cells</text>
<line x1='230' y1='86' x2='250' y2='86' class='lx' stroke-width='1.5'/>
<text x='256.0' y='91.0' font-size='13' class='t2' text-anchor='start'>each cell</text>
<text x='24.0' y='116.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>CRF</text>
<line x1='94.0' y1='350.0' x2='352.0' y2='350.0' class='grid' stroke-width='1'/>
<text x='86.0' y='354.0' font-size='11.5' class='t2' text-anchor='end'>-2</text>
<line x1='94.0' y1='313.3' x2='352.0' y2='313.3' class='grid' stroke-width='1'/>
<text x='86.0' y='317.3' font-size='11.5' class='t2' text-anchor='end'>-1</text>
<line x1='94.0' y1='276.7' x2='352.0' y2='276.7' class='base' stroke-width='1.5'/>
<text x='86.0' y='280.7' font-size='11.5' class='t2' text-anchor='end'>same as 20</text>
<line x1='94.0' y1='240.0' x2='352.0' y2='240.0' class='grid' stroke-width='1'/>
<text x='86.0' y='244.0' font-size='11.5' class='t2' text-anchor='end'>+1</text>
<line x1='94.0' y1='203.3' x2='352.0' y2='203.3' class='grid' stroke-width='1'/>
<text x='86.0' y='207.3' font-size='11.5' class='t2' text-anchor='end'>+2</text>
<line x1='94.0' y1='166.7' x2='352.0' y2='166.7' class='grid' stroke-width='1'/>
<text x='86.0' y='170.7' font-size='11.5' class='t2' text-anchor='end'>+3</text>
<line x1='94.0' y1='130.0' x2='352.0' y2='130.0' class='grid' stroke-width='1'/>
<text x='86.0' y='134.0' font-size='11.5' class='t2' text-anchor='end'>+4</text>
<text x='94.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>12 frames</text>
<text x='208.7' y='370.0' font-size='12' class='t2' text-anchor='middle'>20 frames</text>
<text x='352.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>30 frames</text>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,255.2 208.7,276.7 352.0,279.2'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,234.5 208.7,276.7 352.0,286.9'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,232.5 208.7,276.7 352.0,280.5'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,153.2 208.7,276.7 352.0,319.3'/>
<text x='100.0' y='147.2' font-size='11.5' class='t2' text-anchor='start'>Big Buck Bunny 1080p</text>
<polyline fill='none' class='l1' stroke-width='3' points='94.0,233.5 208.7,276.7 352.0,283.7'/>
<circle cx='94.0' cy='233.5' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='208.7' cy='276.7' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='352.0' cy='283.7' r='4.5' class='s1 ring' stroke-width='2'/>
<text x='362.0' y='287.7' font-size='12' class='t1' text-anchor='start'>median -0.19</text>
<text x='24.0' y='396.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>capped VBR</text>
<line x1='94.0' y1='630.0' x2='352.0' y2='630.0' class='grid' stroke-width='1'/>
<text x='86.0' y='634.0' font-size='11.5' class='t2' text-anchor='end'>-2</text>
<line x1='94.0' y1='593.3' x2='352.0' y2='593.3' class='grid' stroke-width='1'/>
<text x='86.0' y='597.3' font-size='11.5' class='t2' text-anchor='end'>-1</text>
<line x1='94.0' y1='556.7' x2='352.0' y2='556.7' class='base' stroke-width='1.5'/>
<text x='86.0' y='560.7' font-size='11.5' class='t2' text-anchor='end'>same as 20</text>
<line x1='94.0' y1='520.0' x2='352.0' y2='520.0' class='grid' stroke-width='1'/>
<text x='86.0' y='524.0' font-size='11.5' class='t2' text-anchor='end'>+1</text>
<line x1='94.0' y1='483.3' x2='352.0' y2='483.3' class='grid' stroke-width='1'/>
<text x='86.0' y='487.3' font-size='11.5' class='t2' text-anchor='end'>+2</text>
<line x1='94.0' y1='446.7' x2='352.0' y2='446.7' class='grid' stroke-width='1'/>
<text x='86.0' y='450.7' font-size='11.5' class='t2' text-anchor='end'>+3</text>
<line x1='94.0' y1='410.0' x2='352.0' y2='410.0' class='grid' stroke-width='1'/>
<text x='86.0' y='414.0' font-size='11.5' class='t2' text-anchor='end'>+4</text>
<text x='94.0' y='650.0' font-size='12' class='t2' text-anchor='middle'>12 frames</text>
<text x='208.7' y='650.0' font-size='12' class='t2' text-anchor='middle'>20 frames</text>
<text x='352.0' y='650.0' font-size='12' class='t2' text-anchor='middle'>30 frames</text>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,528.4 208.7,556.7 352.0,557.5'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,529.6 208.7,556.7 352.0,564.3'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,564.6 208.7,556.7 352.0,561.1'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,460.9 208.7,556.7 352.0,573.5'/>
<text x='100.0' y='454.9' font-size='11.5' class='t2' text-anchor='start'>Big Buck Bunny 1080p</text>
<polyline fill='none' class='l1' stroke-width='3' points='94.0,529.0 208.7,556.7 352.0,562.7'/>
<circle cx='94.0' cy='529.0' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='208.7' cy='556.7' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='352.0' cy='562.7' r='4.5' class='s1 ring' stroke-width='2'/>
<text x='362.0' y='566.7' font-size='12' class='t1' text-anchor='start'>median -0.16</text>
<text x='240.0' y='672.0' font-size='12' class='t2' text-anchor='middle'>yah265's lookahead depth across, BD-rate points against depth 20 up</text>
<text x='240.0' y='688.2' font-size='12' class='t2' text-anchor='middle'>the side</text>
</g>
</svg>
