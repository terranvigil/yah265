.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>yah265 scores higher than x265 at every</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>picture size and clip length</text>
<text x='20' y='73' font-size='12.5' class='t2'>VMAF v1 at the matched file size, yah265 minus x265. Dot: a row's</text>
<text x='20' y='90' font-size='12.5' class='t2'>median. Tick: the clip with the smallest lead.</text>
