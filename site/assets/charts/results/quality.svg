<svg xmlns='http://www.w3.org/2000/svg' width='900' height='478' viewBox='0 0 900 478' role='img'>
<title>yah265 scores higher than x265 at the same file size in every class and tier</title><desc>Dot plot of the median VMAF v1 difference at matched file size per class and tier, with a whisker to the smallest lead.</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e6e5e1}
.base{stroke:#8a8984}.ring{stroke:#fcfcfb}.band{fill:#efeeea}
.s1{fill:#ff4d1a}.s2{fill:#2a78d6}.s3{fill:#1baf7a}.sx{fill:#8a8984}
.l1{stroke:#ff4d1a}.l2{stroke:#2a78d6}.l3{stroke:#1baf7a}.lx{stroke:#8a8984}.span{stroke:#e6e5e1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2e2e2c}
.base{stroke:#8a8984}.ring{stroke:#1a1a19}.band{fill:#262624}
.s1{fill:#ff4d1a}.s2{fill:#3987e5}.s3{fill:#199e70}.sx{fill:#8a8984}
.l1{stroke:#ff4d1a}.l2{stroke:#3987e5}.l3{stroke:#199e70}.lx{stroke:#8a8984}.span{stroke:#3a3a37}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='24.0' y='40.0' font-size='22' class='t1' text-anchor='start' font-weight='600'>yah265 scores higher than x265 at the same file size in every class and tier</text>
<text x='24.0' y='64.0' font-size='14' class='t2' text-anchor='start'>VMAF v1 at the matched file size, yah265 minus x265. Dot: the group's median. Tick: the clip with the smallest lead.</text>
