<svg xmlns='http://www.w3.org/2000/svg' width='900' height='482' viewBox='0 0 900 482' role='img'>
<title>As shipped, yah265 runs 1.59x to 2.13x faster than x265 on the Mac</title><desc>Dot plot in three panels, one per goal, of how many times faster than x265 medium yah265 runs on the Mac for each class and tier, with a whisker to the slowest clip.</desc>
