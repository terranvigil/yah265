<svg xmlns='http://www.w3.org/2000/svg' width='900' height='420' viewBox='0 0 900 420' role='img'>
<title>A lookahead of 12 costs up to 3.4 BD-rate points against 20</title><desc>Two line charts, CRF and VBR, of the change in BD-rate at lookahead depths 12, 20 and 30 for six cells, with the median drawn heavier.</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e6e5e1}
.base{stroke:#8a8984}.ring{stroke:#fcfcfb}.band{fill:#efeeea}
.s1{fill:#ff4d1a}.s2{fill:#2a78d6}.s3{fill:#1baf7a}.sx{fill:#8a8984}
.l1{stroke:#ff4d1a}.l2{stroke:#2a78d6}.l3{stroke:#1baf7a}.lx{stroke:#8a8984}.span{stroke:#e6e5e1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2e2e2c}
.base{stroke:#8a8984}.ring{stroke:#1a1a19}.band{fill:#262624}
.s1{fill:#ff4d1a}.s2{fill:#3987e5}.s3{fill:#199e70}.sx{fill:#8a8984}
.l1{stroke:#ff4d1a}.l2{stroke:#3987e5}.l3{stroke:#199e70}.lx{stroke:#8a8984}.span{stroke:#3a3a37}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='24.0' y='40.0' font-size='22' class='t1' text-anchor='start' font-weight='600'>A lookahead of 12 costs up to 3.4 BD-rate points against 20</text>
<text x='24.0' y='64.0' font-size='14' class='t2' text-anchor='start'>BD-rate on VMAF v1 at each depth, less the same cell's BD-rate at 20. x265 stays at its own 20 throughout. Below zero is better than 20.</text>
<line x1='24' y1='86' x2='44' y2='86' class='l1' stroke-width='3'/>
<text x='50.0' y='91.0' font-size='13' class='t2' text-anchor='start'>median of the six cells</text>
<line x1='230' y1='86' x2='250' y2='86' class='lx' stroke-width='1.5'/>
<text x='256.0' y='91.0' font-size='13' class='t2' text-anchor='start'>each cell</text>
<text x='24.0' y='116.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>CRF</text>
<line x1='94.0' y1='350.0' x2='326.0' y2='350.0' class='grid' stroke-width='1'/>
<text x='86.0' y='354.0' font-size='11.5' class='t2' text-anchor='end'>-2</text>
<line x1='94.0' y1='313.3' x2='326.0' y2='313.3' class='grid' stroke-width='1'/>
<text x='86.0' y='317.3' font-size='11.5' class='t2' text-anchor='end'>-1</text>
<line x1='94.0' y1='276.7' x2='326.0' y2='276.7' class='base' stroke-width='1.5'/>
<text x='86.0' y='280.7' font-size='11.5' class='t2' text-anchor='end'>same as 20</text>
<line x1='94.0' y1='240.0' x2='326.0' y2='240.0' class='grid' stroke-width='1'/>
<text x='86.0' y='244.0' font-size='11.5' class='t2' text-anchor='end'>+1</text>
<line x1='94.0' y1='203.3' x2='326.0' y2='203.3' class='grid' stroke-width='1'/>
<text x='86.0' y='207.3' font-size='11.5' class='t2' text-anchor='end'>+2</text>
<line x1='94.0' y1='166.7' x2='326.0' y2='166.7' class='grid' stroke-width='1'/>
<text x='86.0' y='170.7' font-size='11.5' class='t2' text-anchor='end'>+3</text>
<line x1='94.0' y1='130.0' x2='326.0' y2='130.0' class='grid' stroke-width='1'/>
<text x='86.0' y='134.0' font-size='11.5' class='t2' text-anchor='end'>+4</text>
<text x='94.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>12 frames</text>
<text x='197.1' y='370.0' font-size='12' class='t2' text-anchor='middle'>20 frames</text>
<text x='326.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>30 frames</text>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,255.2 197.1,276.7 326.0,279.2'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,256.0 197.1,276.7 326.0,276.1'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,214.2 197.1,276.7 326.0,271.0'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,234.5 197.1,276.7 326.0,286.9'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,232.5 197.1,276.7 326.0,280.5'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='94.0,153.2 197.1,276.7 326.0,319.3'/>
<text x='100.0' y='147.2' font-size='11.5' class='t2' text-anchor='start'>Big Buck Bunny 1080p, 10-minute films</text>
<polyline fill='none' class='l1' stroke-width='3' points='94.0,233.5 197.1,276.7 326.0,279.8'/>
<circle cx='94.0' cy='233.5' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='197.1' cy='276.7' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='326.0' cy='279.8' r='4.5' class='s1 ring' stroke-width='2'/>
<text x='336.0' y='283.8' font-size='12' class='t1' text-anchor='start'>median -0.09</text>
<text x='470.0' y='116.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>capped VBR</text>
<line x1='540.0' y1='350.0' x2='772.0' y2='350.0' class='grid' stroke-width='1'/>
<text x='532.0' y='354.0' font-size='11.5' class='t2' text-anchor='end'>-2</text>
<line x1='540.0' y1='313.3' x2='772.0' y2='313.3' class='grid' stroke-width='1'/>
<text x='532.0' y='317.3' font-size='11.5' class='t2' text-anchor='end'>-1</text>
<line x1='540.0' y1='276.7' x2='772.0' y2='276.7' class='base' stroke-width='1.5'/>
<text x='532.0' y='280.7' font-size='11.5' class='t2' text-anchor='end'>same as 20</text>
<line x1='540.0' y1='240.0' x2='772.0' y2='240.0' class='grid' stroke-width='1'/>
<text x='532.0' y='244.0' font-size='11.5' class='t2' text-anchor='end'>+1</text>
<line x1='540.0' y1='203.3' x2='772.0' y2='203.3' class='grid' stroke-width='1'/>
<text x='532.0' y='207.3' font-size='11.5' class='t2' text-anchor='end'>+2</text>
<line x1='540.0' y1='166.7' x2='772.0' y2='166.7' class='grid' stroke-width='1'/>
<text x='532.0' y='170.7' font-size='11.5' class='t2' text-anchor='end'>+3</text>
<line x1='540.0' y1='130.0' x2='772.0' y2='130.0' class='grid' stroke-width='1'/>
<text x='532.0' y='134.0' font-size='11.5' class='t2' text-anchor='end'>+4</text>
<text x='540.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>12 frames</text>
<text x='643.1' y='370.0' font-size='12' class='t2' text-anchor='middle'>20 frames</text>
<text x='772.0' y='370.0' font-size='12' class='t2' text-anchor='middle'>30 frames</text>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,248.4 643.1,276.7 772.0,277.5'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,280.0 643.1,276.7 772.0,277.4'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,217.4 643.1,276.7 772.0,276.4'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,249.6 643.1,276.7 772.0,284.3'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,284.6 643.1,276.7 772.0,281.1'/>
<polyline fill='none' class='lx' stroke-width='1.5' points='540.0,180.9 643.1,276.7 772.0,293.5'/>
<text x='546.0' y='174.9' font-size='11.5' class='t2' text-anchor='start'>Big Buck Bunny 1080p, 10-minute films</text>
<polyline fill='none' class='l1' stroke-width='3' points='540.0,249.0 643.1,276.7 772.0,279.3'/>
<circle cx='540.0' cy='249.0' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='643.1' cy='276.7' r='4.5' class='s1 ring' stroke-width='2'/>
<circle cx='772.0' cy='279.3' r='4.5' class='s1 ring' stroke-width='2'/>
<text x='782.0' y='283.3' font-size='12' class='t1' text-anchor='start'>median -0.07</text>
<text x='450.0' y='406.0' font-size='13' class='t2' text-anchor='middle'>yah265's lookahead depth across, BD-rate points against depth 20 up the side</text>
</svg>
