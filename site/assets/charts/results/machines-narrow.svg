<svg xmlns='http://www.w3.org/2000/svg' width='480' height='1220' viewBox='0 0 480 1220' role='img'>
<title>On all three machines every group's median is at least 1.25x faster</title><desc>Dot plot in three panels, one per goal, of the median times faster than x265 medium for each class and tier on an Apple M5 Max, a Xeon 8488C and a Graviton4.</desc>
