<svg xmlns='http://www.w3.org/2000/svg' width='900' height='430' viewBox='0 0 900 430' role='img'>
<title>yah265's rate curves sit above x265's</title><desc>VMAF v1 against bitrate on five CRF rungs for three titles, yah265 and x265 at preset medium.</desc>
