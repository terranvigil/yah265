<svg xmlns='http://www.w3.org/2000/svg' width='480' height='545.5' viewBox='0 0 480 545.5' role='img'>
<title>All 30 size-matched cells run faster than x265, 1.8x at the median</title><desc>One dot per timed cell: times faster than x265 medium at the same file size on an Apple M5 Max with SIMD on all cores, in a row per picture size, with each row's median marked.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>All 30 size-matched cells run faster than</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>x265, 1.8x at the median</text>
<text x='20' y='73' font-size='12.5' class='t2'>One dot per CRF encode at the same file size, with a line at each</text>
<text x='20' y='90' font-size='12.5' class='t2'>row's median. Preset medium on all cores of an Apple M5 Max.</text>
<g transform='translate(0 26)'>
<line x1='212.9' y1='96' x2='212.9' y2='457.5' class='base' stroke-width='1.5'/>
<text x='212.9' y='477.5' font-size='12' class='t2' text-anchor='middle'>1x (x265)</text>
<line x1='294.6' y1='96' x2='294.6' y2='457.5' class='grid' stroke-width='1'/>
<text x='294.6' y='477.5' font-size='12' class='t2' text-anchor='middle'>1.5x</text>
<line x1='376.3' y1='96' x2='376.3' y2='457.5' class='grid' stroke-width='1'/>
<text x='376.3' y='477.5' font-size='12' class='t2' text-anchor='middle'>2x</text>
<line x1='458.0' y1='96' x2='458.0' y2='457.5' class='grid' stroke-width='1'/>
<text x='458.0' y='477.5' font-size='12' class='t2' text-anchor='middle'>2.5x</text>
<text x='315.0' y='505.5' font-size='13' class='t2' text-anchor='middle'>times faster than x265 (right is faster)</text>
<text x='24.0' y='141.0' font-size='14' class='t1' text-anchor='start' font-weight='600'>CIF</text>
<text x='24.0' y='159.0' font-size='12.5' class='t2' text-anchor='start'>3 cells, median 1.96x</text>
