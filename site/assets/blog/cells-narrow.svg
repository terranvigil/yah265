<circle cx='341.3' cy='320.8' r='4.75' class='s1 ring' stroke-width='1.5'><title>Nocturne 1080p, 10 min: 1.79x faster</title></circle>
<circle cx='341.3' cy='338.0' r='4.75' class='s1 ring' stroke-width='1.5'><title>Pedestrian 1080p: 1.79x faster</title></circle>
<circle cx='341.3' cy='303.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>StEM2 1080p, 10 min: 1.79x faster</title></circle>
<circle cx='346.6' cy='349.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Cosmos Laundromat 1080p, 10 min: 1.82x faster</title></circle>
<circle cx='363.7' cy='320.8' r='4.75' class='s1 ring' stroke-width='1.5'><title>Riverbed 1080p: 1.92x faster</title></circle>
<circle cx='369.9' cy='332.2' r='4.75' class='s1 ring' stroke-width='1.5'><title>Sunflower 1080p: 1.96x faster</title></circle>
<line x1='341.3' y1='286.0' x2='341.3' y2='365.5' class='med' stroke-width='2'/>
<text x='24.0' y='414.5' font-size='14' class='t1' text-anchor='start' font-weight='600'>4K</text>
<text x='24.0' y='432.5' font-size='12.5' class='t2' text-anchor='start'>7 cells, median 1.67x</text>
<circle cx='297.0' cy='417.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Sintel 4K, 10 min: 1.52x faster</title></circle>
<circle cx='308.8' cy='417.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Big Buck Bunny 4K: 1.59x faster</title></circle>
<circle cx='321.8' cy='417.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Big Buck Bunny 4K, 10 min: 1.67x faster</title></circle>
<circle cx='321.8' cy='429.0' r='4.75' class='s1 ring' stroke-width='1.5'><title>Sol Levante 4K, 2 min: 1.67x faster</title></circle>
<circle cx='341.3' cy='417.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>StEM2 4K, 10 min: 1.79x faster</title></circle>
<circle cx='346.6' cy='429.0' r='4.75' class='s1 ring' stroke-width='1.5'><title>Tears of Steel 4K, 10 min: 1.82x faster</title></circle>
