<circle cx='389.9' cy='224.0' r='4.75' class='s1 ring' stroke-width='1.5'><title>Cosmos Laundromat 720p, 10 min: 2.08x faster</title></circle>
<circle cx='397.1' cy='235.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Sintel 720p, 10 min: 2.13x faster</title></circle>
<circle cx='397.1' cy='212.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>Tears of Steel 720p, 10 min: 2.13x faster</title></circle>
<circle cx='412.6' cy='224.0' r='4.75' class='s1 ring' stroke-width='1.5'><title>Ducks take off 720p: 2.22x faster</title></circle>
<circle cx='412.6' cy='235.5' r='4.75' class='s1 ring' stroke-width='1.5'><title>StEM2 720p, 10 min: 2.22x faster</title></circle>
<line x1='363.7' y1='206.0' x2='363.7' y2='252.0' class='med' stroke-width='2'/>
<text x='417.6' y='198.0' font-size='12' class='t1' text-anchor='end'>StEM2 720p, 10 min: 2.22x</text>
