<svg xmlns='http://www.w3.org/2000/svg' width='900' height='538' viewBox='0 0 900 538' role='img'>
<title>yah265 is faster than x265 on all three machines</title><desc>Median times faster than x265 medium at G3, SIMD on all cores, per class and tier, on an Apple M5 Max, an x86-64 Xeon and a Graviton4.</desc>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e6e5e1}
.base{stroke:#8a8984}.ring{stroke:#fcfcfb}
.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.sx{fill:#8a8984}
.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}.lx{stroke:#8a8984}.span{stroke:#e6e5e1}
text{font-family:-apple-system,"IBM Plex Sans",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2e2e2c}
.base{stroke:#8a8984}.ring{stroke:#1a1a19}
.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.sx{fill:#8a8984}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}.lx{stroke:#8a8984}.span{stroke:#3a3a37}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='24.0' y='40.0' font-size='22' class='t1' text-anchor='start' font-weight='600'>Faster than x265 on all three machines, in every class</text>
<text x='24.0' y='64.0' font-size='14' class='t2' text-anchor='start'>Median times faster than x265 medium at the same file size, SIMD on all cores (G3). Parity report of 2026-11-14.</text>
<circle cx='30.0' cy='86.0' r='5.5' class='s1 ring' stroke-width='2'/>
<text x='42.0' y='91.0' font-size='13' class='t2' text-anchor='start'>Mac, NEON</text>
