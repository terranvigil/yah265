<polygon points='255.3,128.5 262.8,136.0 255.3,143.5 247.8,136.0' class='s3 ring' stroke-width='2'/>
<text x='144.0' y='180.0' font-size='12' class='t1' text-anchor='end'>720p short clips</text>
