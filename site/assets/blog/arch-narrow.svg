<svg xmlns='http://www.w3.org/2000/svg' width='480' height='564' viewBox='0 0 480 564' role='img'>
<title>yah265 is faster than x265 on all three machines</title><desc>Median times faster than x265 medium at G3, SIMD on all cores, per picture size and clip length, on an Apple M5 Max, an x86-64 Xeon and a Graviton4.</desc>
<style>
.bg{fill:#ffffff}.t1{fill:#212529}.t2{fill:#495057}.grid{stroke:#e9ecef}
.base{stroke:#868e96}.ring{stroke:#ffffff}.med{stroke:#212529}.band{fill:#f1f3f5}
.s1{fill:#ff4d1a}.s2{fill:#00919a}.s3{fill:#6250d6}.sx{fill:#868e96}
.l1{stroke:#ff4d1a}.l2{stroke:#00919a}.l3{stroke:#6250d6}.lx{stroke:#868e96}.span{stroke:#dee2e6}
.note{fill:#b8330a}.wash{fill:#ffe8dc}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1c1e}.t1{fill:#e9ecee}.t2{fill:#b6bcc1}.grid{stroke:#2e3135}
.base{stroke:#8f959a}.ring{stroke:#1b1c1e}.med{stroke:#e9ecee}.band{fill:#23262a}
.s1{fill:#ff4d1a}.s2{fill:#12a3ad}.s3{fill:#9085e9}.sx{fill:#8f959a}
.l1{stroke:#ff4d1a}.l2{stroke:#12a3ad}.l3{stroke:#9085e9}.lx{stroke:#8f959a}.span{stroke:#3a3e43}
.note{fill:#ff8a5c}.wash{fill:#45200f}}
</style>
<rect width='100%' height='100%' class='bg'/>
<text x='20' y='30' font-size='18' class='t1' font-weight='600'>Faster than x265 on all three machines, at</text>
<text x='20' y='53' font-size='18' class='t1' font-weight='600'>each picture size</text>
<text x='20' y='73' font-size='12.5' class='t2'>Median times faster than x265 medium at the same file size, SIMD on</text>
<text x='20' y='90' font-size='12.5' class='t2'>all cores (G3). Parity report of 2026-11-14.</text>
<g transform='translate(0 26)'>
<circle cx='30.0' cy='86.0' r='5.5' class='s1 ring' stroke-width='2'/>
<text x='42.0' y='91.0' font-size='11.5' class='t2' text-anchor='start'>Mac, NEON</text>
<rect x='108.1' y='81.0' width='9.9' height='9.9' rx='1.5' class='s2 ring' stroke-width='2'/>
<text x='125.1' y='91.0' font-size='11.5' class='t2' text-anchor='start'>x86-64, AVX-512</text>
<polygon points='231.6,79.1 238.5,86.0 231.6,92.9 224.7,86.0' class='s3 ring' stroke-width='2'/>
<text x='243.6' y='91.0' font-size='11.5' class='t2' text-anchor='start'>Graviton4, SVE2</text>
<line x1='179.2' y1='108' x2='179.2' y2='476' class='base' stroke-width='1.5' stroke-dasharray='4 3'/>
<text x='179.2' y='496.0' font-size='12' class='t2' text-anchor='middle'>1x (x265)</text>
<line x1='225.7' y1='108' x2='225.7' y2='476' class='grid' stroke-width='1'/>
<text x='225.7' y='496.0' font-size='12' class='t2' text-anchor='middle'>1.5x</text>
<line x1='272.2' y1='108' x2='272.2' y2='476' class='grid' stroke-width='1'/>
<text x='272.2' y='496.0' font-size='12' class='t2' text-anchor='middle'>2x</text>
<line x1='318.6' y1='108' x2='318.6' y2='476' class='grid' stroke-width='1'/>
<text x='318.6' y='496.0' font-size='12' class='t2' text-anchor='middle'>2.5x</text>
<line x1='365.1' y1='108' x2='365.1' y2='476' class='grid' stroke-width='1'/>
<text x='365.1' y='496.0' font-size='12' class='t2' text-anchor='middle'>3x</text>
<line x1='411.5' y1='108' x2='411.5' y2='476' class='grid' stroke-width='1'/>
<text x='411.5' y='496.0' font-size='12' class='t2' text-anchor='middle'>3.5x</text>
<line x1='458.0' y1='108' x2='458.0' y2='476' class='grid' stroke-width='1'/>
<text x='458.0' y='496.0' font-size='12' class='t2' text-anchor='middle'>4x</text>
<text x='307.0' y='524.0' font-size='13' class='t2' text-anchor='middle'>times faster than x265 (right is faster)</text>
<text x='144.0' y='140.0' font-size='12' class='t1' text-anchor='end'>CIF short clips</text>
