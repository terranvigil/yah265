<svg xmlns='http://www.w3.org/2000/svg' width='900' height='634' viewBox='0 0 900 634' role='img'>
<title>A median 10.2% fewer bits for the same VMAF v1</title><desc>BD-rate against x265 medium on VMAF v1 for the rate ladders, CRF and capped VBR.</desc>
