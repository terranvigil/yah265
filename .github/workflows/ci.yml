name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build ffmpeg cmake python3-numpy
      - name: cache dec265
        id: cache-dec265
        uses: actions/cache@v4
        with:
          path: dec265-bin
          key: dec265-${{ runner.os }}-${{ runner.arch }}-v1.1.1-static
      # the distro's dec265 is 1.0.x, which mis-decodes some open-GOP streams
      - name: build dec265
        if: steps.cache-dec265.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/strukturag/libde265.git de265-src
          cmake -S de265-src -B de265-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build de265-build --target dec265 -j 4
          mkdir -p dec265-bin && cp de265-build/dec265/dec265 dec265-bin/
      - name: build + unit + provenance
        run: make test
      - name: conformance (two-decoder recon gate)
        run: DEC265=$PWD/dec265-bin/dec265 make conformance
      - name: asan/ubsan
        run: DEC265=$PWD/dec265-bin/dec265 make asan

  # The AVX-512 tier under Intel SDE: the hosted runners may lack AVX-512,
  # so checkasm runs on an emulated Sapphire Rapids at both depths.
  avx512-sde:
    runs-on: ubuntu-latest
    env:
      SDE_VERSION: 10.13.1
      SDE_TARBALL: sde-external-10.13.1-2026-07-28-lin.tar.xz
      # Intel's published SHA-256 for that tarball
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build
      - name: cache sde
        id: cache-sde
        uses: actions/cache@v4
        with:
          path: sde-dl
          key: sde-${{ env.SDE_VERSION }}
      - name: download sde
        if: steps.cache-sde.outputs.cache-hit != 'true'
        run: |
          mkdir -p sde-dl
          curl -fsSL -o "sde-dl/$SDE_TARBALL" \
            "https://github.com/petarpetrovt/setup-sde/releases/download/binaries/$SDE_TARBALL"
      - name: unpack sde
        run: |
          echo "$SDE_SHA256  sde-dl/$SDE_TARBALL" | sha256sum -c -
          mkdir -p sde && tar -xJf "sde-dl/$SDE_TARBALL" -C sde --strip-components 1
      - name: build checkasm
        run: |
          meson setup build-sde
          meson setup build10-sde -Dbit_depth=10
          ninja -C build-sde tests/checkasm
          ninja -C build10-sde tests/checkasm
      - name: checkasm under sde -spr
        run: |
          for b in build-sde build10-sde; do
            ./sde/sde64 -spr -- "$b/tests/checkasm" | tee "$b/checkasm.log"
            grep -q 'checking avx512' "$b/checkasm.log"
            if grep -q FAIL "$b/checkasm.log"; then exit 1; fi
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          brew install meson ninja ffmpeg
          python3 -m pip install --break-system-packages numpy
      - name: cache dec265
        id: cache-dec265
        uses: actions/cache@v4
        with:
          path: dec265-bin
          key: dec265-${{ runner.os }}-${{ runner.arch }}-v1.1.1-static
      - name: build dec265
        if: steps.cache-dec265.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.1.1 \
            https://github.com/strukturag/libde265.git de265-src
          cmake -S de265-src -B de265-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build de265-build --target dec265 -j 3
          mkdir -p dec265-bin && cp de265-build/dec265/dec265 dec265-bin/
      - name: build + unit + provenance
        run: make test
      - name: conformance (two-decoder recon gate)
        run: DEC265=$PWD/dec265-bin/dec265 make conformance
