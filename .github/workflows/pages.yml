# SPDX-License-Identifier: GPL-2.0-or-later
# Builds the docs site from site/, with the playground and its
# WebAssembly encoder, and publishes it to GitHub Pages on every
# push to main. Pages must be set to "GitHub Actions" in the repository's
# settings for the deploy step to run.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the playground's encoder module
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 7.0.1
          "$RUNNER_TEMP/emsdk/emsdk" activate 7.0.1
          python -m pip install -q meson ninja
          make wasm EMSDK="$RUNNER_TEMP/emsdk"
      - name: build the site
        run: |
          python -m pip install -q markdown
          python scripts/build_site.py --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
