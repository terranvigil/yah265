# SPDX-License-Identifier: GPL-2.0-or-later
# Static ffmpeg + libyah265 + y265 for Linux x86-64, Linux arm64 and
# macOS arm64. Every run uploads the bundles as workflow artifacts. A tag
# also attaches them to a DRAFT release, with the source tarballs the GPL
# asks for, but only when the repo variable RELEASE_STATIC is true. The
# draft is published by hand.
name: release-static
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the static bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: artifact
          platforms: linux/${{ matrix.arch }}
          build-args: |
            YAH265_REV=${{ github.sha }}
            JOBS=4
          outputs: type=local,dest=out
          cache-from: type=gha,scope=linux/${{ matrix.arch }}
      - name: smoke test
        run: |
          b=out/bundle/bin
          file "$b/ffmpeg" | grep -q 'statically linked'
          file "$b/y265" | grep -q 'statically linked'
          "$b/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 \
            -frames:v 24 -c:v libyah265 -crf 30 s8.mp4
          "$b/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 \
            -frames:v 24 -pix_fmt yuv420p10le -c:v libyah265 -crf 30 s10.mp4
          "$b/ffprobe" -v error -show_entries stream=codec_name,pix_fmt -of csv=p=0 s10.mp4 \
            | grep -qx 'hevc,yuv420p10le'
          "$b/ffmpeg" -v error -i s8.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            out/*.tar.gz
            out/sources/*

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install meson ninja pkgconf
      - name: build the static bundle
        run: |
          packaging/build-static.sh --work out --jobs 3 \
            --name yah265-ffmpeg-macos-arm64
      - name: check linkage and smoke test
        run: |
          b=out/bundle/yah265-ffmpeg-macos-arm64/bin
          for f in ffmpeg ffprobe y265; do
            if otool -L "$b/$f" | tail -n +2 | grep -v -E '^\s*(/usr/lib/|/System/)'; then
              echo "$f links outside the system" >&2; exit 1
            fi
          done
          "$b/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=25 \
            -frames:v 24 -pix_fmt yuv420p10le -c:v libyah265 -crf 30 s10.mp4
          "$b/ffmpeg" -v error -i s10.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/bundle/*.tar.gz

  release:
    needs: [linux, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_STATIC == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: collect assets
        run: |
          mkdir assets
          find dl -name '*.tar.gz' -exec cp -n {} assets/ \;
          cp packaging/build-static.sh assets/
          (cd assets && sha256sum * > SHA256SUMS)
          ls -l assets
      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Static ffmpeg with the libyah265 encoder, and y265, for Linux x86-64,
          Linux arm64 and macOS arm64.

          These binaries are GPL-2.0-or-later. The source of every part they were
          built from is attached below: yah265, the ffmpeg fork at the commit named
          in each bundle's SOURCE.md, and on Linux musl and zlib. Read
          NOTICE-patents.txt in the bundle before redistributing.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "yah265 $GITHUB_REF_NAME" --notes-file notes.md assets/*
